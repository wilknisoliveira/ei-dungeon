<section class="landing-section cta atmospheric-bg">
    <div class="landing-shell cta-inner">
        <h2 class="cta-heading" i18n="@@landingCtaHeading">
            The dungeon doesn't need a calendar invite.
        </h2>

        <div class="cta-actions">
            <a mat-flat-button color="primary" class="cta-primary"
                [routerLink]="isLoggedIn() ? '/home' : '/login'"
                [queryParams]="{ sparks: '1' }" i18n="@@landingRequestSparks">Request free Sparks</a>
        </div>
    </div>
</section>
