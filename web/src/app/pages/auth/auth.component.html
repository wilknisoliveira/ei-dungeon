<section class="atmospheric-bg">
    <app-loading [isLoading]="loading()"></app-loading>
    <div class="main-container" *ngIf="!loading()">
        <div class="login">
            <div class="header-actions">
                <div class="language-button">
                    <app-language-selector></app-language-selector>
                </div>
                <div class="theme-button">
                    <app-theme-toggle></app-theme-toggle>
                </div>
            </div>
            <div class="title">
                <span class="wordmark" i18n="@@appWordmark">EI-DUNGEON</span>
            </div>
            <div class="description" i18n="@@loginDescription">Log in to your account</div>

            <form (ngSubmit)="onSubmit()" #form="ngForm">
                <mat-form-field class="example-full-width">
                    <mat-label i18n="@@emailLabel">Email</mat-label>
                    <input
                        matInput
                        [(ngModel)]="userLogin.email"
                        name="email" type="email" email autocomplete="username"
                        required
                    />
                </mat-form-field>

                <mat-form-field>
                    <mat-label i18n="@@passwordLabel">Enter your password</mat-label>
                    <input
                        matInput
                        [type]="hide() ? 'password' : 'text'"
                        [(ngModel)]="userLogin.password"
                        name="password"
                        required
                    />
                </mat-form-field>

                <a class="login__forgot-password" routerLink="/forgot-password" i18n="@@forgotPasswordLink">Forgot password?</a>
                <div class="login-button">
                    <button
                        type="submit"
                        mat-flat-button
                        color="primary"
                        [disabled]="form.form.invalid"
                        i18n="@@loginButton"
                    >
                        Login
                    </button>
                </div>
                @if (error()) { <p class="login__error" role="alert">{{ error() }}</p> }
            </form>
            <app-google-signin-button (credential)="onGoogle($event)" [disabled]="loading()" [showSeparator]="true" />
            @if (googleAction === 'signup') { <a routerLink="/signup" [queryParams]="sparksIntent" i18n="@@googleGoToSignup">Go to registration</a> }
            @if (googleAction === 'login') { <a routerLink="/login" i18n="@@googleGoToLogin">Sign in to your existing account</a> }
        </div>
        <div class="sign-up">
            <span i18n="@@noAccountPrompt">Don't have an account?</span>&nbsp;<a [routerLink]="['/signup']" [queryParams]="sparksIntent" i18n="@@signUpLink">Sign Up Now</a>
        </div>
    </div>
</section>
