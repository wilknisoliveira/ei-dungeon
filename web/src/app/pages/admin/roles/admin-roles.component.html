<mat-accordion multi>
    @for (group of groups(); track group.role) {
        <mat-expansion-panel>
            <mat-expansion-panel-header>
                <mat-panel-title>{{ group.label }}</mat-panel-title>
                <mat-panel-description>
                    <span>Accounts: {{ group.count }}</span>
                </mat-panel-description>
            </mat-expansion-panel-header>
            <mat-form-field appearance="outline" class="email-filter">
                <mat-label>Search by email</mat-label>
                <input matInput type="search" autocomplete="off" [value]="group.search"
                    (input)="filter(group.role, $any($event.target).value)" />
            </mat-form-field>
            <table mat-table [dataSource]="group.rows" [attr.aria-label]="group.label">
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>Email</th>
                    <td mat-cell *matCellDef="let email">{{ email }}</td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="columns"></tr>
                <tr mat-row *matRowDef="let row; columns: columns"></tr>
                <tr *matNoDataRow>
                    <td class="empty-state">No accounts found in this role.</td>
                </tr>
            </table>
            @if (group.total > 10) {
                <mat-paginator [length]="group.total" [pageIndex]="group.pageIndex"
                    [pageSize]="group.pageSize" [pageSizeOptions]="[10, 25, 50]"
                    [showFirstLastButtons]="true" [attr.aria-label]="group.label"
                    (page)="page(group.role, $event)" />
            }
        </mat-expansion-panel>
    }
</mat-accordion>
