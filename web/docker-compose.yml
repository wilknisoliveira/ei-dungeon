name: ei-dungeon-web

services:
  web:
    image: ei-dungeon-web:latest
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8000}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "${APP_PORT:-8000}:80"
    restart: unless-stopped
