name: ei-dungeon-back

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-uuid-ossp.sql:/docker-entrypoint-initdb.d/10-init-uuid-ossp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ei-back/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: ${BACKEND_PORT:-8080}
      PostgresConnection__PostgresConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      keys__OpenRouterApiKey: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      Sparks__Capacity: ${SPARKS_CAPACITY:-820}
      Sparks__InitialAmount: ${SPARKS_INITIAL_AMOUNT:-15}
      Sparks__RefillAmount: ${SPARKS_REFILL_AMOUNT:-15}
      Sparks__EstimatedUnitCost: ${SPARKS_ESTIMATED_UNIT_COST:-0.0061}
      Sparks__ClosingDay: ${SPARKS_CLOSING_DAY:-10}
      Sparks__RenewalLeadDays: ${SPARKS_RENEWAL_LEAD_DAYS:-3}
      Sparks__QueueIntervalMinutes: ${SPARKS_QUEUE_INTERVAL_MINUTES:-60}
      Sparks__OpenRouterManagementKey: ${SPARKS_OPENROUTER_MANAGEMENT_KEY:-}
      Sparks__AdministrativeRecipientsCsv: ${SPARKS_ADMINISTRATIVE_RECIPIENTS:-}
      Notifications__AdministrativeRecipientsCsv: ${NOTIFICATIONS_ADMINISTRATIVE_RECIPIENTS:-}
      Notifications__WebOrigin: ${NOTIFICATIONS_WEB_ORIGIN:-}
      TokenConfigurations__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Resend__ApiToken: ${RESEND_API_TOKEN:-}
      Resend__From: ${RESEND_FROM:-}
      VerificationCode__HashKey: ${VERIFICATION_CODE_HASH_KEY:-}
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
