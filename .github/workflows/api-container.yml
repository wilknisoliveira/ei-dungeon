name: API container

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-container.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-container.yml'

permissions:
  contents: read

concurrency:
  group: api-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: API build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ei-back.Tests/ei-back.Tests.csproj

      - name: Build application and tests
        run: dotnet build ei-back.Tests/ei-back.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ei-back.Tests/ei-back.Tests.csproj --configuration Release --no-build --no-restore

  image:
    name: API container (publish on main)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${IMAGE_OWNER,,}/ei-dungeon-back" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/ei-back/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
